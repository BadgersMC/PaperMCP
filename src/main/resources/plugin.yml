name: PaperMCP
version: ${version}
main: com.badgersmc.papermcp.PaperMCPPlugin
api-version: 1.20
description: MCP (Model Context Protocol) server adapter for Paper/Spigot servers
author: BadgersMC
website: https://github.com/BadgersMC/PaperMCP

commands:
  papermcp:
    description: PaperMCP plugin management
    usage: /papermcp [reload|status|help]
    permission: papermcp.admin
    aliases: [pmcp, mcp]

permissions:
  papermcp.admin:
    description: Full access to PaperMCP administration
    default: op
  papermcp.mcp.execute:
    description: Allows MCP server to execute commands
    default: false
  papermcp.mcp.read:
    description: Allows MCP server to read server data
    default: false
